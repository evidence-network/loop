name: site

on:
  pull_request:
  push:
    branches: [main]
  # Rebuilds the status page after the nightly loop run (loop.yml, 02:00 UTC).
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Page tests
        run: python3 -B -m unittest discover -s tests -p test_site.py -v
      - name: Status page tests
        run: python3 -B -m unittest discover -s tests -p test_status_page.py -v
      # Builds the report page from the committed reports only. A report the
      # page cannot read fails this step. Deploying the page is a separate job.
      - name: Build the report page
        run: python3 -B site/build.py reports/daily --out _site
      # The status page and the badge the report page embeds, from loop findings
      # and versions.lock. A fresh stage-1 rehearsal run, as loop.yml runs it,
      # lands beside any live run committed under findings/; the page reads the
      # newest of each. A step's FAIL or a refused finding is a red row, not a
      # failed build, so loop.sh's exit code does not stop the page.
      - name: Install each step's pins
        run: |
          for s in steps/*.setup.sh; do
            [ -e "$s" ] || continue
            bash "$s" || echo "::warning::$s exited $?"
          done
      - name: Run stage 1 on the rehearsal population
        run: ./loop.sh --stage 1 --population rehearsal --out "findings/$(date -u +%F)-rehearsal" || echo "::warning::loop.sh exited $?"
      - name: Build the status page
        run: python3 -B status/status_page.py findings --lock versions.lock --out _site/status
      # The leak scan over the page as built. leak_lint.py scans a git tree's
      # tracked files, so the page is staged in a scratch repository outside the
      # checkout and scanned there; nothing is committed. Fail-closed exactly
      # like leak-lint.yml: with the LEAK_LINT_TERMS secret unset (a fork's pull
      # request gets no secrets), the scan exits 2 and the page is not uploaded.
      - name: Internal-leak scan of the built page (term list from secret)
        env:
          LEAK_LINT_TERMS: ${{ secrets.LEAK_LINT_TERMS }}
          LEAK_LINT_REVEAL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          scan="$RUNNER_TEMP/site-scan"
          cp -R _site "$scan"
          git -C "$scan" init -q
          git -C "$scan" add -A
          python3 -B .github/leak_lint.py "$scan"
      - uses: actions/upload-artifact@v4
        with:
          name: report-page
          path: _site
