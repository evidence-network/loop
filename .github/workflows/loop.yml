# The loop, stage 1, then steps 10 and 11, on the rehearsal population: nightly, on a push to main that changes
# anything outside the paths-ignore list below, and by hand. Pull requests do not run it (about 50 minutes):
# `scripts/check.sh --full` runs it before such a push (CONTRIBUTING.md).
# Each step's setup.sh installs its pins from versions.lock (a failing setup fails the job); the
# tool-backed step tests run; loop.sh --strict runs the steps, checks their findings and fails the
# job on a rehearsal FAIL or MALFORMED; findings/ is uploaded as an artifact. On the nightly run
# only, each step whose finding is FAIL opens (or comments on) one issue in this repository,
# labelled loop-step-NN, naming the component repository that owns the step.
name: loop

on:
  schedule:
    - cron: "0 2 * * *"
  # Fail-safe: a push to main runs the loop unless it changes only paths shown never to be read by the loop (its steps,
  # scripts and tests read no top-level Markdown file and nothing under docs/, and no other workflow file). When in
  # doubt a path stays off this list. CONTRIBUTING.md points here for when `scripts/check.sh --full` is due.
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/workflows/commitments.yml"
      - ".github/workflows/dco.yml"
      - ".github/workflows/direct-push.yml"
      - ".github/workflows/ecosystem-gate.yml"
      - ".github/workflows/harvest-allowlist.yml"
      - ".github/workflows/harvest-app-check.yml"
      - ".github/workflows/leak-lint.yml"
      - ".github/workflows/live-alerts.yml"
      - ".github/workflows/live-daily.yml"
      - ".github/workflows/nodes.yml"
      - ".github/workflows/personal-data.yml"
      - ".github/workflows/reports.yml"
      - ".github/workflows/stats.yml"
      - ".github/workflows/versions.yml"
  workflow_dispatch:

permissions:
  contents: read

# No pull request runs it: every run has its own group, so a push, nightly or dispatched run is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # main's history: steps 05 and 12 read nodes/revocations/ as main held it at a run's start, and step 08
          # re-derives live 05 (and 03's carrier commit) from it.
          fetch-depth: 0
      # capsulectl and capsulectl-book are built from source at their pin (steps/12-join.setup.sh), capsule-cli at its own (steps/capsule-cli.setup.sh).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      # A setup that fails fails the job: a step without its pinned tools cannot be judged.
      - name: Install each step's pins
        run: |
          set -e
          for s in steps/*.setup.sh; do
            [ -e "$s" ] || continue
            echo "::group::$s"
            bash "$s"
            echo "::endgroup::"
          done
      # The planted-failure tests of the steps that need real tools. With the tools installed
      # above they run; LOOP_REQUIRE_TOOLS=1 turns a missing tool into an error, never a skip.
      - name: Step tests with the pinned tools
        env:
          LOOP_REQUIRE_TOOLS: "1"
        run: python3 -B -m unittest tests.test_step01_seal tests.test_step02_book tests.test_step04_admit tests.test_step05_deal tests.test_step06_settle tests.test_step07_ask tests.test_step08_verify tests.test_step09_dispute tests.test_step10_judge tests.test_step11_report tests.test_step12_join tests.test_step13_ask_across tests.test_goose_rehearsal tests.test_commitment1 tests.test_staple_verify tests.test_ledger_proof -v
      # --strict: a rehearsal FAIL or MALFORMED finding fails the job (exit 3, or 1 for a refused finding).
      - name: Run stage 1 on the rehearsal population
        run: |
          set -o pipefail
          # One date for the whole job: a run that crosses midnight UTC keeps one directory.
          out="findings/$(date -u +%F)-rehearsal"
          echo "LOOP_OUT=$out" >> "$GITHUB_ENV"
          ./loop.sh --stage 1 --population rehearsal --strict --out "$out" | tee loop-summary.txt
      # Step 13 ask-across (loop#440): a mesh node and a Goose node ask each other for evidence both ways, on rehearsal keys; 08
      # re-derives the finding. --strict fails a FAIL or MALFORMED but allows NOT_CHECKED, so check_cross_run.py then holds
      # both rehearsal directions to PASS and 08-verify/verified.json to step 13 with status "reproduced": 08 not being FAIL
      # is not enough, an unreproduced step only makes 08 NOT_CHECKED. The live cells are NOT_CHECKED (loop#442, loop#443)
      # and are not run here.
      - name: Run the cross stage (step 13) on the rehearsal population
        run: |
          set -o pipefail
          cross="findings/cross/$(date -u +%F)-rehearsal"
          echo "CROSS_OUT=$cross" >> "$GITHUB_ENV"
          ./loop.sh --stage cross --ecosystem cross --population rehearsal --strict --out "$cross" | tee loop-summary-cross.txt
          python3 -B scripts/check_cross_run.py "$cross"
      # A FAIL line of the cross stage joins loop-summary.txt, which the nightly issue step reads (the line's last field is the directory).
      - name: Add the cross stage's FAIL lines to the summary
        if: always()
        run: |
          [ -f loop-summary-cross.txt ] || exit 0
          awk -v d="${CROSS_OUT:-findings/cross}" '$3 == "FAIL" {print $1, $2, $3, d}' loop-summary-cross.txt >> loop-summary.txt
      # Steps 10 and 11 end to end (evidence-network/loop#206). Stage 1's run holds records of one of the pack's kinds
      # (07, loop#62), so 10 judges them: PASS, or NOT_CHECKED for the kinds with no record (05, 06, 09), and 11 carries that over.
      # A FAIL, a malformed finding or another result fails the job; a FAIL also goes into loop-summary.txt, so the nightly run
      # opens its issue below. Judging real records is covered by tests.test_step10_judge and tests.test_step11_report.
      - name: Run steps 10 and 11 on the rehearsal population
        run: |
          set -euo pipefail
          run="$LOOP_OUT"
          steps/10-judge --population population/rehearsal --out "$run/10-judge"
          steps/11-report --population population/rehearsal --out "$run/11-report"
          python3 -B steps/finding.py check "$run"
          python3 -B status/findings.py "$run"
          python3 -B - "$run" <<'PY'
          import json, sys
          from pathlib import Path
          run = Path(sys.argv[1])
          want = {"10-judge": ("PASS", "NOT_CHECKED"), "11-report": ("PASS", "NOT_CHECKED")}
          bad, failed = [], {}
          for step, result in want.items():
              f = json.loads((run / step / "finding.json").read_text())
              print(f"{run.name} {step} {f['result']}")
              if f["result"] == "FAIL":
                  failed.setdefault(step, run.name)
              if f["result"] not in result:
                  bad.append(f"{run.name}/{step} is {f['result']}, expected {' or '.join(result)}: {f['detail'][:400]}")
          with open("loop-summary.txt", "a") as summary:
              for step, where in failed.items():
                  summary.write(f"{step[:2]} {step[3:]} FAIL {where}\n")
          # Step 10 must find 07's records in its window: an empty window would hide a step 07 that sealed nothing.
          nc = json.loads((run / "10-judge" / "finding.json").read_text()).get("not_checked") or []
          if "the pack over the window" in [n["what"] for n in nc]:
              bad.append(f"{run.name}/10-judge found no record in its window: {nc}")
          sys.exit("\n".join(bad) or None)
          PY
      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-rehearsal-${{ github.run_id }}
          path: findings/
          if-no-files-found: warn
      - name: Open or update one issue per failing step
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POPULATION: rehearsal
        run: |
          # The repository that owns each step's component, by population. Live step 12 probes
          # through the reporter's mesh_evidence_request path until capsules-plugin#53, and a live
          # commitment is signed by the node itself (capsules-plugin#51).
          declare -A OWNER=(
            [rehearsal:01]=action-state-group/agent-action-capsule
            [rehearsal:02]=action-state-group/evidencebook
            [rehearsal:03]=evidence-network/loop
            [rehearsal:12]=action-state-group/evidencebook
            [rehearsal:13]=evidence-network/loop
            [rehearsal:10]=evidence-network/loop
            [rehearsal:11]=evidence-network/loop
            [live:01]=action-state-group/agent-action-capsule
            [live:02]=action-state-group/evidencebook
            [live:03]=Mesh-LLM/capsules-plugin
            [live:12]=Mesh-LLM/capsules-plugin
          )
          [ -f loop-summary.txt ] || exit 0
          while read -r nn name result where <&3; do
            [ "$result" = FAIL ] || continue
            label=loop-step-$nn
            owner=${OWNER[$POPULATION:$nn]:-unknown}
            gh label create "$label" --color B60205 --description "loop step $nn failed" --force
            body="Step $nn ($name) is FAIL on the nightly $POPULATION run: $RUN_URL
          The finding is in the run's findings artifact, under ${where:+$where/}$nn-$name/finding.json.
          Owning component repository: $owner."
            n=$(gh issue list --label "$label" --state open --json number --jq '.[0].number')
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "$body"
            else
              gh issue create --title "loop step $nn ($name) fails" --label "$label" --body "$body"
            fi
          done 3< loop-summary.txt
      # Any failed run on main (the nightly, or a dispatch on main) also opens or comments on one ci-red issue for the
      # workflow, which the coordinator's watchdog lists; the loop-step-NN issues above stay as they are.
      - name: Report a failed run on main
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "loop failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
