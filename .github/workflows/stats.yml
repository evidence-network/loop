name: stats

on:
  pull_request:
  push:
    branches: [main]
  # Rebuilds the site after the nightly loop run (loop.yml, 02:00 UTC).
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  # The required check keeps its name, `site`: it builds the stats site and
  # scans it on every pull request, push to main and nightly run.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stats site tests
        run: python3 -B -m unittest discover -s tests -p test_site.py -v
      - name: Status page tests
        run: python3 -B -m unittest discover -s tests -p test_status_page.py -v
      # The page's acceptance checks: the expected page, the negative fixture,
      # each <details> table against its SVG, titles, no scripts or external URLs.
      - name: Stats page checks
        run: python3 -B -m unittest discover -s tests -p test_stats_redesign.py -v
      # Contrast (4.5:1 in both colour schemes) and 12px labels, computed from
      # site/template.html's tokens; no network.
      - name: Stats page contrast check
        run: python3 -B -m unittest discover -s tests -p test_stats_contrast.py -v
      # The reporter rehearsal's TEST page and its MISSED slots, kept apart from the daily rows.
      - name: Rehearsal page tests
        run: python3 -B -m unittest discover -s tests -p test_rehearsal.py -v
      # The watch page (site/watch.py): each day's graph against its day file, a node joining and leaving,
      # three distinct edge outcomes, no external URL, no amount or band, "not measured yet" without a finding,
      # contrast in both schemes, and /stats/ unchanged by its build.
      - name: Watch page tests
        run: python3 -B -m unittest discover -s tests -p test_watch.py -v
      # The page built from the committed fixtures, byte for byte against the
      # committed expected page. It is built outside _site and never deployed.
      - name: Stats page against the committed expected page
        run: |
          python3 -B site/build.py tests/fixtures/stats/daily --findings tests/fixtures/stats/findings --lock versions.lock --out "$RUNNER_TEMP/fixture-site"
          diff -u tests/fixtures/stats/expected/index.html "$RUNNER_TEMP/fixture-site/stats/index.html"
      # The loop's rows and numbers come from loop findings and versions.lock.
      # A fresh stage-1 rehearsal run, as loop.yml runs it, lands beside any
      # live run committed under findings/; the site reads the newest of each.
      # A step's FAIL or a refused finding is a red step, not a failed build, so
      # loop.sh's exit code does not stop the site. For M1 the job runs stage 1
      # itself; later it can read loop.yml's findings artifact.
      - name: Install each step's pins
        run: |
          for s in steps/*.setup.sh; do
            [ -e "$s" ] || continue
            bash "$s" || echo "::warning::$s exited $?"
          done
      - name: Run stage 1 on the rehearsal population
        run: ./loop.sh --stage 1 --population rehearsal --out "findings/$(date -u +%F)-rehearsal" || echo "::warning::loop.sh exited $?"
      # The site from the scrubbed day files (stats/data/daily/) and the
      # findings only, into _site/stats/: the Pages URL ends /loop/stats/. A day
      # file the site cannot read fails this step, and nothing is deployed.
      # The reporter rehearsal's slots (stats/data/rehearsal/, a test), while
      # there are any, get their own page under a TEST label: _site/stats/rehearsal/.
      - name: Build the stats site
        run: python3 -B site/build.py stats/data/daily --findings findings --lock versions.lock --out _site --rehearsal stats/data/rehearsal
      # The watch page, into _site/watch/ (Pages URL /loop/watch/), from the same committed files plus nodes/
      # and population/. It runs after build.py, which empties _site. Its scripts run on this page only.
      - name: Build the watch page
        run: python3 -B site/watch.py --daily stats/data/daily --rehearsal stats/data/rehearsal --findings findings --nodes nodes --population population --out _site
      # The page rendered headless in the Chrome that ubuntu-latest carries, one screenshot per view, kept as a
      # workflow artifact. The page carries its data inline, so a file:// load draws it. A missing or
      # near-empty image fails the step; whether the graph is right is for a reader of the screenshot.
      - name: Render the watch page headless
        run: |
          shots="$RUNNER_TEMP/watch-screenshots"
          mkdir -p "$shots"
          for view in live rehearsal; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1300,1400 \
              --virtual-time-budget=5000 --screenshot="$shots/watch-$view.png" \
              "file://$GITHUB_WORKSPACE/_site/watch/index.html#$view"
            test "$(stat -c %s "$shots/watch-$view.png")" -gt 20000
          done
      - uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: ${{ runner.temp }}/watch-screenshots
      # The leak scan over the site as built. leak_lint.py scans a git tree's
      # tracked files, so the site is staged in a scratch repository outside the
      # checkout and scanned there; nothing is committed. Fail-closed exactly
      # like leak-lint.yml: with the LEAK_LINT_TERMS secret unset (a fork's pull
      # request gets no secrets), the scan exits 2 and the site is not uploaded.
      - name: Internal-leak scan of the built site (term list from secret)
        env:
          LEAK_LINT_TERMS: ${{ secrets.LEAK_LINT_TERMS }}
          LEAK_LINT_REVEAL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          scan="$RUNNER_TEMP/site-scan"
          cp -R _site "$scan"
          git -C "$scan" init -q
          git -C "$scan" add -A
          python3 -B .github/leak_lint.py "$scan"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploys the scanned site to GitHub Pages, from main only. Pages must be
  # enabled by a repository admin first (Settings > Pages > Source: GitHub
  # Actions); until then this job fails and the `site` check is unaffected.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits and does not cancel one that is
    # deploying. Only this job takes the group, so pull request builds never queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}stats/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
