name: nodes

on:
  pull_request:
  # The daily live harvest's pull request is opened with GITHUB_TOKEN, which starts no pull_request workflow;
  # live-daily.yml dispatches this one on the harvest branch so its check attaches to the pull request's head.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checker self-test
        run: |
          python3 scripts/check_nodes.py tests/nodes/good
          ! python3 scripts/check_nodes.py tests/nodes/bad-key
          ! python3 scripts/check_nodes.py tests/nodes/dup
          ! python3 scripts/check_nodes.py tests/nodes/no-consent
          ! python3 scripts/check_nodes.py tests/nodes/email-contact
          ! python3 scripts/check_nodes.py tests/nodes/phone-contact
      - name: Check the commitment list
        run: python3 scripts/check_nodes.py nodes
