name: reports

# The reporter code and its tests, on every pull request. The reports themselves
# live in evidence-network/loop-data, whose own reports workflow is the 09:00 UTC
# watchdog for a missed day; this repository receives no reports.
on:
  pull_request:
  # The daily live harvest's pull request is opened with GITHUB_TOKEN, which starts no pull_request workflow;
  # live-daily.yml dispatches this one on the harvest branch so its check attaches to the pull request's head.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reporter tests
        run: python3 -m unittest discover -s tests -v
      - name: Check the reports
        run: python3 scripts/check_reports.py reports/daily
