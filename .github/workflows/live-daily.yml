# The daily live run (evidence-network/loop#368, replacing the Claude scheduled task of loop#314): start
# scripts/live_daily.sh on the lab host, harvest its findings with scripts/live_harvest.py into a data-only pull request
# opened with a GitHub App installation token (minted in the harvest step only; a GITHUB_TOKEN pull request cannot run its
# required checks by itself: pull_request runs wait for approval and pull_request_target never starts, loop#395), and fail visibly. See ops/live-ci/README.md for the trust model.
#
# Fork exposure: this workflow runs on `schedule` and `workflow_dispatch` only (never pull_request, pull_request_target
# or push), only from main, and its one job sits in the `live-lab` environment, which accepts deployments from main
# alone. Cloud access is a short-lived OIDC exchange pinned to this repository, main and that environment; no cloud
# key is stored (the environment secrets hold infrastructure names and the harvest GitHub App's id and private key, which
# only the harvest step reads) and no self-hosted runner is involved, and a fork pull request cannot start the job or obtain the token.
name: live-daily

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      harvest_only:
        description: "Do not start a run: harvest today's finished run (after a failed harvest)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: live-daily
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: live-lab
    permissions:
      contents: read # the App token, not this one, pushes the findings branch and creates the release
      issues: write # the loop-live-failed issue
      actions: write # dispatching the required checks on the findings branch
      id-token: write # the OIDC token for the cloud exchange
    # Environment secrets, not variables: a secret is masked in every log line, step headers included, so the host,
    # project, zone and user of a public repository's logs never show.
    env:
      LIVE_VM: ${{ secrets.LIVE_VM }}
      LIVE_PROJECT: ${{ secrets.LIVE_PROJECT }}
      LIVE_ZONE: ${{ secrets.LIVE_ZONE }}
      LIVE_LAB_USER: ${{ secrets.LIVE_LAB_USER }}
      # The auth action leaves gcloud without an account name; os-login (ssh) crashes on it (TypeError in quote_from_bytes).
      CLOUDSDK_CORE_ACCOUNT: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      HARVEST_ONLY: ${{ inputs.harvest_only }}
      LIVE_STATE: init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the push is authenticated in ci.sh with the App token, never this job's token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.LIVE_WIF_PROVIDER }}
          service_account: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      - name: Skip rule and start
        run: source ops/live-ci/ci.sh && start_run
      # The access token lives an hour and a run up to three: authenticate again before each wait.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.LIVE_STATE == 'waiting'
        with:
          workload_identity_provider: ${{ secrets.LIVE_WIF_PROVIDER }}
          service_account: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      - name: Wait (1)
        if: env.LIVE_STATE == 'waiting'
        run: source ops/live-ci/ci.sh && wait_run 50
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.LIVE_STATE == 'waiting'
        with:
          workload_identity_provider: ${{ secrets.LIVE_WIF_PROVIDER }}
          service_account: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      - name: Wait (2)
        if: env.LIVE_STATE == 'waiting'
        run: source ops/live-ci/ci.sh && wait_run 50
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.LIVE_STATE == 'waiting'
        with:
          workload_identity_provider: ${{ secrets.LIVE_WIF_PROVIDER }}
          service_account: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      - name: Wait (3)
        if: env.LIVE_STATE == 'waiting'
        run: source ops/live-ci/ci.sh && wait_run 50
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.LIVE_STATE == 'waiting'
        with:
          workload_identity_provider: ${{ secrets.LIVE_WIF_PROVIDER }}
          service_account: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      - name: Wait (4)
        if: env.LIVE_STATE == 'waiting'
        run: source ops/live-ci/ci.sh && wait_run 50
      - name: Out of time
        if: env.LIVE_STATE == 'waiting'
        run: echo "LIVE_STATE=timeout" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.LIVE_STATE == 'done'
        with:
          workload_identity_provider: ${{ secrets.LIVE_WIF_PROVIDER }}
          service_account: ${{ secrets.LIVE_SERVICE_ACCOUNT }}
      # No fallback: without the two HARVEST_APP_* environment secrets this step fails and the harvest fails visibly.
      - name: Mint the harvest App token
        id: app
        if: env.LIVE_STATE == 'done'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HARVEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.HARVEST_APP_PRIVATE_KEY }}
          repositories: loop
          permission-contents: write
          permission-pull-requests: write
      - name: Harvest into a findings pull request
        if: ${{ !cancelled() && env.LIVE_STATE == 'done' }} # runs after a failed mint too, so ci.sh reports it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }} # dispatching the checks stays with the job's own token
        run: source ops/live-ci/ci.sh && harvest
      - name: Make the failure visible
        if: failure() || cancelled() || env.LIVE_STATE == 'failed' || env.LIVE_STATE == 'timeout'
        env:
          GH_TOKEN: ${{ github.token }}
        run: source ops/live-ci/ci.sh && report_failure "${LIVE_STATE}"
      - name: Fail the run when the live run did
        if: env.LIVE_STATE == 'failed' || env.LIVE_STATE == 'timeout'
        run: exit 1
