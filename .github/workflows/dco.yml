# SPDX-License-Identifier: Apache-2.0
# Every commit in a pull request carries a DCO sign-off (`git commit -s`). See CONTRIBUTING.md.
# Runs on pull_request: it needs no secret, and the PR's own copy of dco.py only reads git log.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        run: python3 .github/dco.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
