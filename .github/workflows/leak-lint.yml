# SPDX-License-Identifier: Apache-2.0
# leak-lint: fail the build if internal workflow text (bracketed task ids, and the term classes
# in the LEAK_LINT_TERMS secret) reaches this public repository. The bracketed-id rule is
# generic and lives in .github/leak_lint.py; the term list is NOT in this repository (a public
# gate listing the terms would itself publish them) and is supplied at run time from the
# LEAK_LINT_TERMS repository secret. Fail-closed: with the secret unset, every run exits 2.
#
# WHY pull_request_target: a pull_request run from a fork gets no secrets, so the lint would
# fail closed on every outside PR. pull_request_target gives the run the secret, which is safe
# here only because nothing from the pull request is ever executed. The PR head is checked out
# into ./pr as INERT DATA and read as text by the BASE branch's copy of leak_lint.py; no step
# builds, installs, tests or runs anything from ./pr; credentials are not persisted; the job
# can only read.
#
# >>> IF YOU ADD A STEP THAT RUNS, BUILDS, OR INSTALLS ANYTHING FROM ./pr, YOU HAVE HANDED THE
# >>> LEAK_LINT_TERMS SECRET TO ANY STRANGER WHO OPENS A PULL REQUEST. The lint's own unit
# >>> tests run in reports.yml, on pull_request, which correctly receives no secrets.
name: leak-lint

on:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-lint:
    runs-on: ubuntu-latest
    steps:
      # Base repo: TRUSTED. Supplies the scanner and its exact-text allowlist.
      - name: Checkout base (trusted, provides the scanner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PR head: UNTRUSTED, checked out as data only. Never executed.
      - name: Checkout pull request head into ./pr (inert data, never executed)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          # The inert-data case: ./pr is only read as text by the base scanner.
          allow-unsafe-pr-checkout: true

      - name: Internal-leak scan (term list from secret)
        env:
          LEAK_LINT_TERMS: ${{ secrets.LEAK_LINT_TERMS }}
          SCAN_ROOT: ${{ github.event_name == 'pull_request_target' && 'pr' || '.' }}
          # Print matched lines ONLY on a trusted run (not a fork's pull_request_target). On an
          # untrusted run a term hit yields one constant verdict.
          LEAK_LINT_REVEAL: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 .github/leak_lint.py "$SCAN_ROOT"
