# The capsules plugin (the repo was Mesh-LLM/capsules): the v0.1.18 release (tag on 6d54aba), ten releases after the
# previous pin v0.1.8 (cc21587). Breaking or visible changes on the way: 0.1.9 retires served_summary/1 and turns
# share_adjudications and share_exchange_corroboration on by default; 0.1.11 moves the chain from capsules.jsonl to
# the EvidenceBook shelf (ledger/shelf.db; a one-way migration at first start, `capsules export-flat` goes back);
# 0.1.16 signs the evidence-commitment/1 profile, records failed exchanges (sealing one needs a host that sends
# failure_class, mesh-llm#2852, which this lab host build has) and moves the staple to history_cards. v0.1.17 adds the signed commitment published
# to Nostr relays when advertise_evidence_requests is on (#269), the peer's history_card/1 asked for at join (#273)
# and agreement terms and records that cite the inference-deals digest (#274: both nodes need this release, an older
# provider refuses the new terms member). v0.1.18 makes the 4.41 referee the default with a lowered-margin display (#282, #286) and
# declares min_host_version 0.78.0 in plugin.toml (#283); its dependency pins are v0.1.17's. The INFERENCE_DEALS_DIGEST equals the pack_source_digest of the
# inference-deals pin below. The ledger-checkpoint console route and `capsules ledger-check` (loop#276) remain; the lab
# leaves CAPSULES_CHECKPOINT_CADENCE unset, so the cadence is on and a ledger-checkpoint ask is served.
# v0.1.20 (Mesh-LLM/capsules-plugin, tag 2026-11-20), three releases after v0.1.17: 0.1.19 answers the node's own Nostr mailbox when
# advertise_evidence_requests is on (#293, the responder of loop#442) and asks one with the `nostr_evidence_request` tool
# (#295, loop#443), and CAPSULES_NOSTR_RELAY_MAP points the relay a commitment names at a lab's own (lab.sh LAB_NOSTR_NODES);
# 0.1.20 moves the plugin to the checkpointed-local-log 0.6 stack (#301: a checkpoint carries the bare log id as the CWT sub, so
# every checkpoint, anchor digest and signature differs; a witness must accept both sub forms; NO DOWNGRADE, the earlier plugin
# stops on the ledger, so a lab node's data directory is copied before the first start), answers history_card/2 and staples it in
# the commitment (#302, #304), counts referee verdicts in service_history/2 (#299) and marks the ledger's format (#309).
# v0.1.21 (tag 2026-11-21): nostr_evidence_request takes an optional `commitment` ({commitment, policy}, the responder's own signed
# commitment/1; the checkpoint key is read from its stapled history_cards[].checkpoint_key) so a node whose checkpoint key differs
# from its envelope key can be asked (#316, caps-70); a node past the 1 MiB answer cap no longer names history_card/1 (/2 stays).
# v0.1.22 (tag 2026-11-21): the commitment check behind nostr_evidence_request's `commitment` accepts a peer card in community
# mesh-llm, muse or goose, so a Goose node's card (community goose) no longer gets HTTP 400 "not a known community" (#321, loop#443).
# v0.1.23 (tag 2026-11-21): `checkpoint_range` replaces the unranged `checkpoints` ask, which a node past the 1 MiB answer cap now drops; doctor --probe asks the range
# (#317, AAC#645), so lab-3 (past the cap) answers history_card/2 and a ranged checkpoint and steps 07 and 12 can judge it.
# main at 251f6eb2 (2026-11-26): v0.1.24 (tag 2026-11-25) plus the #368 crate refactors #379-#385, as capsules 0.1.24-main.251f6eb.
capsules Mesh-LLM/capsules-plugin 251f6eb25322d636df178db6b69b52d928e33514
