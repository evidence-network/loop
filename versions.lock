# versions.lock: the only place the loop's pins change. See VERSIONS.md.
# One pin per line: <name> <repository> <ref>. <ref> is a full 40-hex commit
# SHA or a released version tag; never a branch name or a short SHA.
# The daily reporter writes this file's sha256 into each day's RUN.json.

# Lab host build: mesh-llm main 3947de0c merged into the #2620 branch at its head 5fc649c8
# (#2620 is still open: a plugin the host restarts gets the mesh snapshot again, and a plugin
# whose start was cancelled is restarted). The lab source must contain both commits.
mesh-llm Mesh-LLM/mesh-llm 3947de0cbc73fe5cbcaae548b297f03a401532d7
mesh-llm-pr-2620 Mesh-LLM/mesh-llm 5fc649c888b7ac4b3e75865de06a901b476629c0
# The capsules plugin (the repo was Mesh-LLM/capsules). main after v0.1.5: it adds the controller
# declaration (#77), share at completion by default (#72), the signed commitment (#75) and the
# Lightning settlement adapter (#82, for #57). No release carries them yet; its manifests and
# dependencies are v0.1.5's.
capsules Mesh-LLM/capsules-plugin 06532ef981b345118e0a6fe142fb896acbc18e5b
# The answer format the plugin verifies with today: the evidence-request crate,
# pinned =0.2.0 in the plugin's Cargo.toml at that commit. crates.io 0.2.0 is published from
# this tag (its .cargo_vcs_info.json names the tag's commit, dd64efe7).
evidence-request action-state-group/agent-action-capsule crates/evidence-request-v0.2.0
# The daily reporter: scripts/daily_report.py as of this commit (main after #3).
reporter evidence-network/loop 4d00c42c9856fc892f7309ee9b434dca1bb69202
# What a verifier re-checks saved answers with, offline: evidencebook, and capsulectl
# built from the same evidencebook tag.
capsulectl action-state-group/evidencebook v0.8.1
evidencebook action-state-group/evidencebook v0.8.1
# step 02 book
# The log evidencebook v0.8.1's Rust crate embeds, as its Cargo.lock and step 02's driver lock it.
checkpointed-local-log action-state-group/checkpointed-local-log crates/checkpointed-local-log-v0.3.1
# AAC's Rust crate, whose witness receipt verifier evidencebook v0.8.1's crate calls.
aac-rust action-state-group/agent-action-capsule crates/agent-action-capsule-v0.4.1
# step 12 join
# The capsulectl-book plugin the join creates and probes the book with (`book doctor --probe`),
# built from the evidencebook tag's capsulectl/ module.
capsulectl-book action-state-group/evidencebook v0.8.1
# step 01 seal
# The sealer (Python, PyPI capsule-emit 0.13.0) and the second-language Class 1
# verifier (the AAC Go module's cross_language command).
capsule-emit action-state-group/capsule-emit python/v0.13.0
aac-go action-state-group/agent-action-capsule go/v0.14.0
