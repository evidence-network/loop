# versions.lock: the only place the loop's pins change. See VERSIONS.md.
# One pin per line: <name> <repository> <ref>. <ref> is a full 40-hex commit
# SHA or a released version tag; never a branch name or a short SHA.
# The daily reporter writes this file's sha256 into each day's RUN.json.

# Lab host build (a lab build, not a release; loop#436): one tree on the payer, Mesh-LLM/mesh-llm main at e1b0128 (a daily-lab-build
# base: main plus Ethan's open PRs, each squashed to one commit whose message carries the PR's head SHA, as the asg-lab-rebuild
# task does) and two open PRs, #3008 (the recommended plugin set is installed by default in setup and update) and #3040
# (the plugin upgrade checks run on automatic and bootstrap upgrades; stacked on #3008, so its commit holds only its own
# changes over #3008's head). The previous lab build (lab/asg-2026-10-31c, main c86f58e plus seven PRs, mesh-llm 0.78.0) kept the
# node's own payments feature; mesh-llm#2654 removed it, so payments run through the pay-lightning plugin below.
# lab/lab.sh check requires the lab source to contain mesh-llm and every mesh-llm-pr-<N> pin, as an ancestor or as the head named in a
# squash commit's message.
mesh-llm Mesh-LLM/mesh-llm e1b0128bf022a3fa0374a016fc05b3bbebafa27e
mesh-llm-pr-3008 Mesh-LLM/mesh-llm 98016e56019064e5d0328d9abb750c761b722ea3
mesh-llm-pr-3040 Mesh-LLM/mesh-llm c6e754563bcf2330e0eebc7b9b499738b35cada2
# mesh-llm#3066: openai.exchange.v1 exchange_id on the raw-proxy, plugin and remote-mesh routes equals the ingress request id that
# pay-lightning's payer events carry, so capsules can join the payer's terms leg to the exchange (step 06 counterparty_count).
mesh-llm-pr-3066 Mesh-LLM/mesh-llm 93f9279665bcd233615bb9765d9c4295bbeee54f
# The payment plugin: Mesh-LLM/ln-payments-plugin main at 14a5f97 plus #11 (a settled payment's preimage on
# payment.lifecycle.v1, which the capsules plugin's settlement check reads), merged on the lab host; lab/lab.sh check
# requires both. The host passes the event on unchanged (payment.lifecycle.v1 is a local channel it broadcasts without reading),
# so step 06's finality needs no mesh-llm change. The wallet plugin is lexe-wallet-plugin#7 (head 9f830c1): it maps the Lexe
# SDK's payment preimage, which pay-lightning carries; the lab has run this build since the 11-06 wallet setup.
pay-lightning Mesh-LLM/ln-payments-plugin 14a5f977cc713f2ab3f1876b9286477524c71a33
pay-lightning-pr-11 Mesh-LLM/ln-payments-plugin 8ff201b5ece2dd65a2c3cc579adc208ea4ace74d
lexe-wallet Mesh-LLM/lexe-wallet-plugin 9f830c181b4042a81069df50752cf19d035a5047
# The capsules plugin (the repo was Mesh-LLM/capsules): the v0.1.18 release (tag on 6d54aba), ten releases after the
# previous pin v0.1.8 (cc21587). Breaking or visible changes on the way: 0.1.9 retires served_summary/1 and turns
# share_adjudications and share_exchange_corroboration on by default; 0.1.11 moves the chain from capsules.jsonl to
# the EvidenceBook shelf (ledger/shelf.db; a one-way migration at first start, `capsules export-flat` goes back);
# 0.1.16 signs the evidence-commitment/1 profile, records failed exchanges (sealing one needs a host that sends
# failure_class, mesh-llm#2852, which this lab host build has) and moves the staple to history_cards. v0.1.17 adds the signed commitment published
# to Nostr relays when advertise_evidence_requests is on (#269), the peer's history_card/1 asked for at join (#273)
# and agreement terms and records that cite the inference-deals digest (#274: both nodes need this release, an older
# provider refuses the new terms member). v0.1.18 makes the 4.41 referee the default with a lowered-margin display (#282, #286) and
# declares min_host_version 0.78.0 in plugin.toml (#283); its dependency pins are v0.1.17's. The INFERENCE_DEALS_DIGEST equals the pack_source_digest of the
# inference-deals pin below. The ledger-checkpoint console route and `capsules ledger-check` (loop#276) remain; the lab
# leaves CAPSULES_CHECKPOINT_CADENCE unset, so the cadence is on and a ledger-checkpoint ask is served.
# LAB BUILD: capsules-plugin main at the merge of Mesh-LLM/capsules-plugin#292 (0e2a9cb, merged 2026-11-13; its PR head was 07976bd).
# #292 makes the settlement channel accept pay-lightning's own local lifecycle relay (source "plugin:pay-lightning", a non-peer-id
# target still required), which v0.1.18 refuses, so step 06 had no preimage to check. Unreleased: swap for the release tag.
capsules Mesh-LLM/capsules-plugin 0e2a9cb8d6f240586734ef10437278427f18e7ea
