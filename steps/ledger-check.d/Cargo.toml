[package]
name = "loop-ledger-check"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Step 08's offline ledger check: shows a kept copy of a node's ledger file is the whole file at the node's signed checkpoint, with the same library calls `capsules ledger-check` makes (checkpointed-local-log), over a copy that may hold preimage-redacted lines."

[[bin]]
name = "loop-ledger-check"
path = "src/main.rs"

# checkpointed-local-log is the version versions.lock pins (0.5.0, the log evidencebook 0.0.15 embeds, which steps 02
# and 05 share). The capsules plugin at versions.lock (v0.1.17) builds its checkpoints with 0.4.0 (0.3.1 at v0.1.8), so
# this check reads 0.4.0 checkpoints with 0.5.0; live run 2026-11-09-live-3 (step 04 PASS, the kept ledger copies checked
# with this tool) shows that it verifies them. Cargo.lock is committed; steps/ledger-check.setup.sh builds with --locked.
[dependencies]
checkpointed-local-log = "=0.5.0"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
