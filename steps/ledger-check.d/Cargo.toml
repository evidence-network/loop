[package]
name = "loop-ledger-check"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Step 08's offline ledger check: shows a kept copy of a node's ledger file is the whole file at the node's signed checkpoint, with the same library calls `capsules ledger-check` makes (checkpointed-local-log), over a copy that may hold preimage-redacted lines."

[[bin]]
name = "loop-ledger-check"
path = "src/main.rs"

# checkpointed-local-log is the version the capsules plugin at versions.lock builds its checkpoints and range
# proofs with (capsules-plugin v0.1.8 Cargo.toml: 0.3.1). Cargo.lock is committed;
# steps/ledger-check.setup.sh builds with --locked.
[dependencies]
checkpointed-local-log = "=0.3.1"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
