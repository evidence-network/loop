# A drop-in for the daily units (loop-reporter.service, loop-reporter-ask.service), so
# they read the same optional settings as loop-reporter-rehearsal.service, without the
# units themselves changing: ~/.config/loop-reporter/env (see reporter/reporter.env.example).
# Install as each unit's drop-in; reporter/README.md, "The reporter's own node", has the commands.
[Service]
EnvironmentFile=-%h/.config/loop-reporter/env
